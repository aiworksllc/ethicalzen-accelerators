<div class="page-header">
  <h1>Compliance Certificates</h1>
  <p>Active compliance certificates with contract associations and guardrail details</p>
</div>

<!-- Summary Stats -->
<div class="kpi-grid" style="margin-bottom:24px">
  <div class="kpi-card">
    <div class="kpi-label">Total Certificates</div>
    <div class="kpi-value" id="cert-total">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Active</div>
    <div class="kpi-value" id="cert-active" style="color:var(--success)">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Expiring Soon</div>
    <div class="kpi-value" id="cert-expiring" style="color:var(--warning)">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Expired</div>
    <div class="kpi-value" id="cert-expired" style="color:var(--error)">-</div>
  </div>
</div>

<!-- Certificates List -->
<div class="card">
  <div class="card-header">
    <span class="card-title">Certificates</span>
    <button class="btn btn-sm btn-primary" onclick="loadCertificates()">Refresh</button>
  </div>
  <div id="certificates-list">
    <div class="empty-state" style="padding:40px">
      <div class="loading-spinner"></div>
      <p style="margin-top:16px">Loading certificates...</p>
    </div>
  </div>
</div>

<!-- Certificate Details Modal -->
<div id="cert-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--bg-primary);border-radius:12px;max-width:700px;width:90%;max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <div style="padding:20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0" id="cert-modal-title">Certificate Details</h3>
      <button onclick="closeCertModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-secondary)">&times;</button>
    </div>
    <div id="cert-modal-content" style="padding:20px"></div>
  </div>
</div>

<script>
async function init_certificates() {
  await loadCertificates();
}

async function loadCertificates() {
  const container = document.getElementById('certificates-list');
  container.innerHTML = '<div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>';

  try {
    const data = await API.certificates();
    const certs = Array.isArray(data) ? data : (data.certificates || data.data || []);

    updateStats(certs);

    if (!certs.length) {
      container.innerHTML = `
        <div class="empty-state" style="padding:60px">
          <div class="empty-state-icon">&#128220;</div>
          <div class="empty-state-title">No Certificates Found</div>
          <div class="empty-state-text">Compliance certificates will appear here once configured</div>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <table class="data-table">
        <thead>
          <tr>
            <th>Certificate</th>
            <th>Framework</th>
            <th>Contract</th>
            <th>Status</th>
            <th>Expires</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${certs.map(cert => `
            <tr>
              <td>
                <div style="font-weight:600">${cert.name || cert.id}</div>
                <div class="mono" style="font-size:11px;color:var(--text-muted)">${cert.id}</div>
              </td>
              <td><span class="badge badge-info">${cert.framework || cert.suite || '-'}</span></td>
              <td>${cert.contract_id || cert.contractId || '-'}</td>
              <td>${getStatusBadge(cert)}</td>
              <td>${formatExpiration(cert.expires_at || cert.expiresAt)}</td>
              <td>
                <button class="btn btn-sm btn-secondary" onclick="viewCertificate('${cert.id}')">View</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    container.innerHTML = `
      <div class="empty-state" style="padding:40px">
        <div class="empty-state-icon" style="color:var(--error)">&#9888;</div>
        <div class="empty-state-title">Failed to Load Certificates</div>
        <div class="empty-state-text">${err.message}</div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="loadCertificates()">Retry</button>
      </div>
    `;
  }
}

function updateStats(certs) {
  const now = new Date();
  const thirtyDays = 30 * 24 * 60 * 60 * 1000;

  let active = 0, expiring = 0, expired = 0;

  certs.forEach(cert => {
    const expiresAt = new Date(cert.expires_at || cert.expiresAt);
    if (expiresAt < now) {
      expired++;
    } else if (expiresAt - now < thirtyDays) {
      expiring++;
      active++;
    } else {
      active++;
    }
  });

  document.getElementById('cert-total').textContent = certs.length;
  document.getElementById('cert-active').textContent = active;
  document.getElementById('cert-expiring').textContent = expiring;
  document.getElementById('cert-expired').textContent = expired;
}

function getStatusBadge(cert) {
  const expiresAt = new Date(cert.expires_at || cert.expiresAt);
  const now = new Date();
  const thirtyDays = 30 * 24 * 60 * 60 * 1000;

  if (cert.status === 'revoked') {
    return '<span class="badge badge-error">Revoked</span>';
  }
  if (expiresAt < now) {
    return '<span class="badge badge-error">Expired</span>';
  }
  if (expiresAt - now < thirtyDays) {
    return '<span class="badge badge-warning">Expiring Soon</span>';
  }
  return '<span class="badge badge-success">Active</span>';
}

function formatExpiration(dateStr) {
  if (!dateStr) return '-';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = date - now;

  if (diff < 0) {
    return `<span style="color:var(--error)">${Utils.formatDate(dateStr)}</span>`;
  }

  const days = Math.ceil(diff / (24 * 60 * 60 * 1000));
  if (days <= 30) {
    return `<span style="color:var(--warning)">${Utils.formatDate(dateStr)} (${days}d)</span>`;
  }
  return Utils.formatDate(dateStr);
}

async function viewCertificate(id) {
  const modal = document.getElementById('cert-modal');
  const content = document.getElementById('cert-modal-content');

  modal.style.display = 'flex';
  content.innerHTML = '<div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>';

  try {
    const cert = await API.certificateById(id);
    document.getElementById('cert-modal-title').textContent = cert.name || cert.id;

    content.innerHTML = `
      <div style="display:grid;gap:16px">
        <div class="detail-section">
          <h4 style="margin:0 0 12px;color:var(--text-secondary);font-size:12px;text-transform:uppercase">Certificate Info</h4>
          <div style="display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:14px">
            <strong>ID:</strong><span class="mono">${cert.id}</span>
            <strong>Name:</strong><span>${cert.name || '-'}</span>
            <strong>Framework:</strong><span>${cert.framework || cert.suite || '-'}</span>
            <strong>Profile:</strong><span>${cert.profile || '-'}</span>
            <strong>Status:</strong><span>${getStatusBadge(cert)}</span>
            <strong>Issued:</strong><span>${Utils.formatDate(cert.issued_at || cert.issuedAt)}</span>
            <strong>Expires:</strong><span>${formatExpiration(cert.expires_at || cert.expiresAt)}</span>
          </div>
        </div>

        ${cert.contract_id || cert.contractId ? `
        <div class="detail-section">
          <h4 style="margin:0 0 12px;color:var(--text-secondary);font-size:12px;text-transform:uppercase">Contract Association</h4>
          <div style="display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:14px">
            <strong>Contract ID:</strong><span class="mono">${cert.contract_id || cert.contractId}</span>
            <strong>Tenant:</strong><span>${cert.tenant_id || cert.tenantId || '-'}</span>
          </div>
        </div>
        ` : ''}

        ${cert.guardrails && cert.guardrails.length ? `
        <div class="detail-section">
          <h4 style="margin:0 0 12px;color:var(--text-secondary);font-size:12px;text-transform:uppercase">Guardrails (${cert.guardrails.length})</h4>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${cert.guardrails.map(g => `<span class="badge badge-info">${typeof g === 'string' ? g : g.name || g.id}</span>`).join('')}
          </div>
        </div>
        ` : ''}

        <div class="detail-section">
          <h4 style="margin:0 0 12px;color:var(--text-secondary);font-size:12px;text-transform:uppercase">Raw Data</h4>
          <div class="json-preview" style="font-size:11px;max-height:200px;overflow:auto">${Utils.syntaxHighlight(cert)}</div>
        </div>
      </div>
    `;
  } catch (err) {
    content.innerHTML = `
      <div class="empty-state" style="padding:20px">
        <div style="color:var(--error)">Failed to load certificate: ${err.message}</div>
      </div>
    `;
  }
}

function closeCertModal() {
  document.getElementById('cert-modal').style.display = 'none';
}

// Close modal on backdrop click
document.getElementById('cert-modal')?.addEventListener('click', (e) => {
  if (e.target.id === 'cert-modal') closeCertModal();
});
</script>
